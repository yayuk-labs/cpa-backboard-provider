# Merge into your CPA configuration. Put credentials in CPA's auth directory.
plugins:
  enabled: true
  dir: plugins
  configs:
    cpa-backboard-provider:
      enabled: true
      # Omit models to discover the full catalog; [] exposes no models.
      models:
        - provider: openai
          name: gpt-4o-mini
          alias: backboard-mini
